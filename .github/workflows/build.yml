name: Build Yaad

# Free CI: every push builds a debug APK and a release App Bundle,
# then publishes both as a public GitHub Release for one-tap download.
# No paid services, no self-hosted runners — GitHub Actions free tier.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'android/app/build.gradle', 'android/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android SDK packages
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found, skipping"; exit 0; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "ndk;28.2.13676358" || true

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK (for direct install / testing)
        id: build-apk
        run: |
          set +e
          flutter build apk --debug > "$RUNNER_TEMP/apk-build.log" 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            SECTION=$(awk '/FAILURE: Build failed with an exception/,/\* Try:/' "$RUNNER_TEMP/apk-build.log" | head -n 25)
            if [ -z "$SECTION" ]; then
              SECTION=$(tail -n 12 "$RUNNER_TEMP/apk-build.log")
            fi
            echo "$SECTION" | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $CODE

      # Test builds (commit message contains [skip-aab]) skip the Play Store
      # bundle — the debug APK below is all a tester needs, and this saves
      # a full second native compile (~5-8 min).
      - name: Build release App Bundle (for Play Store)
        id: build-aab
        if: ${{ !contains(github.event.head_commit.message, '[skip-aab]') }}
        run: |
          set +e
          flutter build appbundle --release > "$RUNNER_TEMP/aab-build.log" 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            SECTION=$(awk '/FAILURE: Build failed with an exception/,/\* Try:/' "$RUNNER_TEMP/aab-build.log" | head -n 25)
            if [ -z "$SECTION" ]; then
              SECTION=$(tail -n 12 "$RUNNER_TEMP/aab-build.log")
            fi
            echo "$SECTION" | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $CODE

      - name: Upload debug APK
        if: ${{ !cancelled() && steps.build-apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: yaad-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release AAB
        if: ${{ !cancelled() && steps.build-aab.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: yaad-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish release
        if: ${{ !cancelled() && steps.build-apk.outcome == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yaad build ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
