name: Build Yaad

# Free CI: every push builds a debug APK and a release App Bundle,
# then publishes both as a public GitHub Release for one-tap download.
# No paid services, no self-hosted runners — GitHub Actions free tier.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android SDK packages
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found, skipping"; exit 0; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK (for direct install / testing)
        run: |
          set +e
          flutter build apk --debug > "$RUNNER_TEMP/apk-build.log" 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            SECTION=$(awk '/FAILURE: Build failed with an exception/,/\* Try:/' "$RUNNER_TEMP/apk-build.log" | head -n 25)
            if [ -z "$SECTION" ]; then
              SECTION=$(tail -n 12 "$RUNNER_TEMP/apk-build.log")
            fi
            echo "$SECTION" | sed 's/%/%25/g; s/\r/%0D/g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit $CODE

      - name: Build release App Bundle (for Play Store)
        run: flutter build appbundle --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaad-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yaad-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yaad build ${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
