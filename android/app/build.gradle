plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "app.yaad.finance"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "app.yaad.finance"
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Pinned debug keystore (android/debug.keystore, committed to the repo).
        // CI runners are ephemeral and each generates a fresh debug key by default,
        // which made every build uninstallable over the previous one ("conflicts
        // with the existing app"). A stable debug key keeps test builds updatable.
        // This is a DEBUG key only — never use it for a production release upload.
        debug {
            storeFile = rootProject.file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.getByName("debug")
        }
        release {
            // Signing config is added by CI (Play App Signing) or locally.
            // For a local release build, create android/key.properties.
            signingConfig = signingConfigs.getByName("debug")
            // The Flutter Gradle plugin now enables R8 for release builds by
            // default; it fails on this project's plugin set, so keep the
            // classic non-minified release build (revisit with proguard rules).
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
